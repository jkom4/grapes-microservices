services:
  shiny-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grapes-insights-app
    restart: unless-stopped
    ports:
      - "3838:3838"
    environment:
      - MYSQL_USER=adminMasi
      - MYSQL_PWD=@adminMASI
      - MYSQL_HOST=mariadb-db
      - MYSQL_DB_ACTIVITIES=BD_OPER_ACTIVITIES
      - MONGO_URI=mongodb://mongoadmin:P%40ssw0rd@mongo-db:27017/
      - MONGO_DB_AUTH=BD_OPER_PROC_AUTH
      - DECIS_MONGO_URI=mongodb://mongoadmin:P%40ssw0rd@mongo-db:27017/
      - DECIS_MONGO_DB=BD_DECIS_TEMP
      - USER=${USER:-unknown}
    depends_on:
      - mariadb-db
      - mongo-db
    networks:
      - app-network

  mariadb-db:
    image: mariadb:10.6
    container_name: grapes-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=P@ssw0rd
      - MARIADB_DATABASE=BD_OPER_ACTIVITIES
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - app-network

  mongo-db:
    image: mongo:6.0
    container_name: grapes-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=P@ssw0rd
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

volumes:
  mariadb_data:
  mongo_data:

networks:
  app-network:
    driver: bridge
