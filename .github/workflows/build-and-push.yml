name: Build, Test, Push & Deploy (Docker)

on:
  workflow_dispatch:  # Allows you to manually launch

permissions:
  id-token: write
  contents: read
jobs:
  build:
    name: Build Microservices
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

        # DskipTests to skip running tests during the build process.
      - name: "🔍 Build API Gateway"
        run: mvn -B clean install -DskipTests --file api-gateway/pom.xml

      - name: "🔍 Build Auth Service"
        run: mvn -B clean install -DskipTests --file auth-service/auth-backend/pom.xml

      - name: "🔍 Build Chat Service"
        run: mvn -B clean install -DskipTests --file chat-service/pom.xml

      - name: "🔍 Build Payment Service"
        run: mvn -B clean install -DskipTests --file payment-service/payment-backend/pom.xml

      - name: "🔍 Build Sales Service"
        run: mvn -B clean install -DskipTests --file sales-service/pom.xml

      - name: 🐍 Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: "🧪 Install dependencies for Python Microservices"
        run: pip install -r data-mining-service/requirements.txt

      ## FRONTEND
      - name: 🌐 Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: "📦 Install Frontend-web Dependencies"
        run: |
          cd frontend-web
          npm ci --legacy-peer-deps
          npm run-script build

      - name: "📦 Install Frontend-auth Dependencies"
        run: |
          cd auth-service/auth-frontend
          npm ci --legacy-peer-deps
          npm run-script build

      - name: "📦 Install Frontend-Payment Dependencies"
        run: |
          cd payment-service/payment-frontend
          npm ci --legacy-peer-deps
          npm run-script build

  tests :
    name: Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠️ Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "🔍 Run Tests for API Gateway"
        run: mvn -B test --file api-gateway/pom.xml

      - name: "🔍 Run Tests for Auth Service"
        run: mvn -B test --file auth-service/auth-backend/pom.xml

      - name: "🔍 Run Tests for Chat Service"
        run: mvn -B test --file chat-service/pom.xml

      - name: "🔍 Run Tests for Payment Service"
        run: mvn -B test --file payment-service/payment-backend/pom.xml

      - name: "🔍 Run Tests for Sales Service"
        run: mvn -B test --file sales-service/pom.xml

      - name: 🐍 Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: 🧪 Run Tests for Python Microservices
        working-directory: ./data-mining-service
        run: |
          pip install -r requirements.txt
          pytest

#      ## FRONTEND
#      - name: 🌐 Install Node.js
#        uses: actions/setup-node@v3
#        with:
#          node-version: 18
#
#      - name: 🧪 Run Frontend Tests
#        working-directory: ./frontend-web
#        run: |
#          npm run test

  docker-build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - build
      - tests

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create .env file from GitHub secrets
        run: |
          cat <<EOF > .env
          # 🌍 General config
          ENVIRONMENT=development
          LOG_LEVEL=debug

          # 🚀 API Gateway
          GATEWAY_PORT=8090

          # 🔐 Authentication Service
          AUTH_SERVICE_PORT=8091
          TOKEN_EXPIRATION=3600
          AUTH_MONGO_URI=${{ secrets.MONGO_URI }}
          AUTH_MONGO_DB=db_auth
          GRAPES_AES_KEY=${{ secrets.GRAPES_AES_KEY }}
          GRAPES_TWILIO_API_SECRET=${{ secrets.GRAPES_TWILIO_API_SECRET }}
          COMPANY_MAIL=${{ secrets.COMPANY_MAIL }}
          GRAPES_JWT_SECRET_KEY=${{ secrets.GRAPES_JWT_SECRET_KEY }}

          # 📦 Sales Service
          SALES_SERVICE_PORT=8092
          SALES_DB_URL=${{ secrets.SALES_DB_URL }}
          SALES_DB_USER=${{ secrets.SALES_DB_USER }}
          SALES_DB_PASSWORD=${{ secrets.SALES_DB_PASSWORD }}

          # 💳 Payment Service
          PAYMENT_SERVICE_PORT=8093
          PAYMENT_DB_URL=${{ secrets.PAYMENT_DB_URL }}
          PAYMENT_DB_USER=${{ secrets.PAYMENT_DB_USER }}
          PAYMENT_DB_PASSWORD=${{ secrets.PAYMENT_DB_PASSWORD }}

          # 💬 Chat Service
          CHAT_SERVICE_PORT=8094
          CHAT_MONGO_URI=${{ secrets.CHAT_MONGO_URI }}
          CHAT_MONGO_DB=db_chat

          # 📊 Database
          # MariaDB
          DB_PORT=3306
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          # MongoDB
          MONGO_PORT=27017
          MONGO_USER=${{ secrets.MONGO_USER }}
          MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}

          # 🐰 Message Broker (RabbitMQ)
          RABBITMQ_HOST=rabbitmq
          RABBITMQ_PORT=5672
          RABBITMQ_USER=${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}

          # 📈 Monitoring
          PROMETHEUS_PORT=${{ secrets.PROMETHEUS_PORT || '9090' }}
          GRAFANA_PORT=${{ secrets.GRAFANA_PORT || '3000' }}

          # 🛠️ SonarQube
          SONARQUBE_HOST=http://localhost:9000
          SONARQUBE_TOKEN=${{ secrets.SONARQUBE_TOKEN }}
          SONARQUBE_JDBC_USERNAME=${{ secrets.SONARQUBE_JDBC_USERNAME }}
          SONARQUBE_JDBC_PASSWORD=${{ secrets.SONARQUBE_JDBC_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          # ☁️ Oracle Cloud (OCIR)
          ORACLE_REGION_ID=${{ secrets.ORACLE_REGION_ID }}
          ORACLE_TENANCY_NAMESPACE=${{ secrets.ORACLE_TENANCY_NAMESPACE }}
          
          #REPLICATION
          DB_REPLICATION_USER=${{ secrets.DB_REPLICATION_USER }}
          DB_REPLICATION_PASSWORD=${{ secrets.DB_REPLICATION_PASSWORD }}
          MARIADB_MASTER_HOST=${{ secrets.VM3_IP }}
          EOF
          

      - name: 🔑 Log in to OCIR
        run:  |
          echo "${{ secrets.ORACLE_AUTH_TOKEN }}" | docker login -u "${{ secrets.ORACLE_TENANCY_NAMESPACE }}/${{ secrets.ORACLE_USERNAME }}" --password-stdin ${{ secrets.ORACLE_REGION_ID }}.ocir.io

      # 🐳 Multi-Arch build for ARM-hosted services (VM3)
      - name: 🏗️ Build & Push Multi-Arch Services (ARM-Compatible)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/mariadb-grapes:latest \
            --push ./docker/mariadb

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/mongodb-grapes:latest \
            --push ./docker/mongodb

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/rabbitmq-grapes:latest \
            --push ./docker/rabbitmq

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/api-gateway:latest \
            --push ./api-gateway

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/auth-service-backend:latest \
            --push ./auth-service/auth-backend

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/sales-service:latest \
            --push ./sales-service

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/payment-service-backend:latest \
            --push ./payment-service/payment-backend

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/chat-service:latest \
            --push ./chat-service

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.ORACLE_REGION_ID }}.ocir.io/${{ secrets.ORACLE_TENANCY_NAMESPACE }}/grapeshub/data-mining-service:latest \
            --push ./data-mining-service

      # 🧱 Default Arch Build (x86 only) for Frontends (VM2)
      - name: 🏗️ Build & Push Frontend Services (amd64 only)
        run: |
          docker compose build frontend-web frontend-auth frontend-payment
          docker compose push frontend-web frontend-auth frontend-payment
  deploy-backend:
    name: Deploy to VM 1 - Replica + Monitoring (Manual)
    runs-on: ubuntu-latest
    needs:
      - build
      - tests
    if: github.event_name == 'workflow_dispatch'  # Launches only if manual

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔑 SSH into ORACLE VM and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM1_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM1_KEY }}
          script: |
            cd grapes-microservices
            git pull origin main
            sudo docker compose pull 
            sudo docker compose down 
            sudo docker compose -f docker-compose-vm1.yml up -d

  deploy-frontend:
    name: Deploy to VM 2 - FRONTEND
    runs-on: ubuntu-latest
    needs:
      - build
      - tests
    if: github.event_name == 'workflow_dispatch'  # Launches only if manual

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔑 SSH into ORACLE VM and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM2_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM2_KEY }}
          script: |
            cd grapes-microservices
            git pull origin main
            sudo docker compose pull 
            sudo docker compose down 
            sudo docker compose -f docker-compose-vm2.yml up -d

  deploy-bd:
      name: Deploy to VM 3 - VM ARM (Manual)
      runs-on: ubuntu-latest
      needs:
        - build
        - tests
      if: github.event_name == 'workflow_dispatch'  # Launches only if manual

      steps:
        - name: 📥 Checkout repository
          uses: actions/checkout@v3

        - name: 🔑 SSH into ORACLE VM and Deploy
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.VM3_IP }}
            username: ${{ secrets.VM_USER }}
            key: ${{ secrets.VM3_KEY }}
            script: |
              cd grapes-microservices
              git pull origin main
              sudo docker compose pull 
              sudo docker compose down 
              sudo docker compose -f docker-compose-vm3.yml up -d