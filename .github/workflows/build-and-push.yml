name: Build, Test, Push & Deploy (Docker)
on:
  workflow_dispatch:  # Correct - permet un déclenchement manuel

permissions:
  id-token: write    # Nécessaire pour certaines auth cloud
  contents: read     # Standard pour checkout

jobs:
  deploy:
    name: Deploy on Azure VM (Manual)
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch'  # Correct pour un déclenchement manuel

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3  # Bonne pratique

      - name: 🔑 SSH into Azure VM and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd grapes-microservices
            git pull origin main
            docker compose pull sales-service
            docker compose down sales-service
            docker compose up -d sales-service