name: Enforce Strict Rules

on:
  pull_request:
    branches:
      - main
      - develop
      - sprint-*
  workflow_dispatch:  # Allows you to manually launch


# 🔑 Explicite Permissions
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  check-admins:
    name: Enforce Rules Tests
    runs-on: ubuntu-latest
    env:  # 
      SALES_SERVICE_PORT: 8081
      SALES_DB_URL:  ${{ secrets.SALES_DB_URL }}
      SALES_DB_USER:  ${{ secrets.SALES_DB_USER }}
      SALES_DB_PASSWORD:  ${{ secrets.SALES_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if PR author is an admin
        id: admin_check
        run: |
          AUTHOR=$(jq -r ".pull_request.user.login" "$GITHUB_EVENT_PATH")
          ADMIN_LIST=("Jkom4")
          
          for admin in "${ADMIN_LIST[@]}"; do
            if [[ "$AUTHOR" == "$admin" ]]; then
              echo "❌ Admin users cannot bypass test requirements."
              echo "failure=true" >> $GITHUB_OUTPUT
              exit 1
            fi
          done
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Check for test files
        id: test_files
        run: |
          if ! find . -type f -name "*test*" | grep -q .; then
            echo "❌ No test files found. Please add tests before merging."
            echo "failure=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java version
        run: java -version

      # 🔹 Test Api-gateway
      - name: Run Tests for Api Gateway
        working-directory: ./api-gateway
        run: mvn -B validate test -Dspring.profiles.active=test



      # 🔹 Test Auth Service
      - name: Run Tests for Auth Service
        working-directory: ./auth-service/auth-backend
        run: mvn -B validate test -Dspring.profiles.active=test



      # 🔹 Test Chat Service
      - name: Run Tests for Chat Service
        working-directory: ./chat-service
        run: mvn -B validate test -Dspring.profiles.active=test


      # 🔹 Test Payment Service
      - name: Run Tests for Payment Service
        working-directory: ./payment-service/payment-backend
        run: mvn -B validate test -Dspring.profiles.active=test

      # 🔹 Test Sales Service
      - name: Run Tests for Sales Service
        working-directory: ./sales-service
        run: mvn -B validate test -Dspring.profiles.active=test


      # 🔹 Test Data Mining (Python)
      - name: 🐍 Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Run Tests for Data-Mining Service
        working-directory: ./data-mining-service
        run: |
          echo "RABBITMQ_PORT=5672" >> .env
          echo "RABBITMQ_HOST=localhost" >> .env
          pip install -r requirements.txt
          python -m pytest ./data_ingestion_service/tests/

      # ⚠️ Final status report
      - name: Determine overall status
        id: status_check
        run: |
          if [[ "${{ steps.admin_check.outputs.failure }}" == "true" ]] || \
             [[ "${{ steps.test_files.outputs.failure }}" == "true" ]] || \
             [[ "${{ contains(fromJson(toJson(steps.*.outputs)), 'tests_failed=true') }}" == "true" ]]; then
              echo "::error::Validation or tests failed"
              echo "final_status=failure" >> $GITHUB_OUTPUT
              exit 1
          else
              echo "final_status=success" >> $GITHUB_OUTPUT
          fi
          

      - name: Report status
        if: always()
        run: |
          if [[ "${{ steps.status_check.outputs.final_status }}" == "failure" ]]; then
            exit 1
          fi
