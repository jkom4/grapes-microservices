name: Enforce Strict Rules

on:
  pull_request:
    branches:
      - main
      - develop
      - sprint-1


jobs:
  check-admins:
    name: Prevent Admin Merges Without Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if PR author is an admin
        run: |
          AUTHOR=$(jq -r ".pull_request.user.login" "$GITHUB_EVENT_PATH")
          ADMIN_LIST=("Jkom4")
          
          for admin in "${ADMIN_LIST[@]}"; do
            if [[ "$AUTHOR" == "$admin" ]]; then
              echo "❌ Admin users cannot bypass test requirements."
              exit 1
            fi
          done

      - name: Check for test files
        run: |
          if ! find . -type f -name "*test*" | grep -q .; then
            echo "❌ No test files found. Please add tests before merging."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Java version
        run: java -version

      # 🔹 Test Api-gateway (Spring Boot)
      - name: Run Tests for Api Gateway (Java)
        working-directory: ./api-gateway
        run: mvn validate test

      # 🔹 Test Auth (Spring Boot)
      - name: Run Tests for Auth Service (Java)
        working-directory: ./auth-service/auth-backend
        run: mvn validate test

      # 🔹 Chat Service (Spring Boot)
      - name: Run Tests for Chat Service (Java)
        working-directory: ./chat-service
        run: mvn validate test

      # 🔹 Test Payment (Spring Boot)
      - name: Run Tests for Payment Service (Java)
        working-directory: ./payment-service/payment-backend
        run: mvn validate test

      # 🔹 Test Sales (Spring Boot)
      - name: Run Tests for Sales Service (Java)
        working-directory: ./sales-service
        run: mvn validate test

      # 🔹 Test Data Mining (Python)
      - name: 🐍 Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Run Tests for Data-Mining Service (Pyhton)
        working-directory: ./data-mining-service
        run: |
          pip install -r requirements.txt

