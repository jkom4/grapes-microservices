version: '3.8'

services:
### DATABASES
  mariadb:
    build: ./docker/mariadb
    container_name: grapes-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: SparringMASI!
      MARIADB_USER: module
      MARIADB_PASSWORD: SparringMASI!
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mariadb/volumes/mariadb_data:/var/lib/mysql

  mongodb:
    build: ./docker/mongodb
    container_name: grapes-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: SparringMASI!
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["--auth"]  # To activate authentication

### Exchange
  rabbitmq:
    build: ./docker/rabbitmq
    container_name: grapes-rabbitmq
    volumes:
      - ./docker/rabbitmq/volumes/data/:/var/lib/rabbitmq/mnesia
      - ./docker/rabbitmq/volumes/logs/:/var/log/rabbitmq/
    environment:
      RABBITMQ_DEFAULT_USER: grapes
      RABBITMQ_DEFAULT_PASS: grapes
    ports:
      - "5672:5672"
      - "15673:15672"

### MONITORING
  sonarqube:
    image: sonarqube:lts-community
    container_name: grapes-sonarqube
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    ports:
      - "9000:9000"
    depends_on:
      - sonarqube-db

  sonarqube-db:
    image: postgres:13
    container_name: grapes-sonarqube-db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    container_name: grapes-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: grapes-grafana
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "3000:3000"
    depends_on:
      - prometheus


### BACKEND

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    depends_on:
      - mongodb
      - mariadb
      - data-mining-service
      - auth-service
      - sales-service
      - payment-service
      - chat-service

  auth-service:
    build: ./auth-service/auth-backend
    container_name: auth-backend
    ports:
      - "8091:8091"
    depends_on:
      - mongodb
      - mariadb

  sales-service:
    build: ./sales-service
    container_name: sales-backend
    ports:
      - "8092:8092"
    depends_on:
      - mariadb

  payment-service:
    build: ./payment-service/payment-backend
    container_name: payment-backend
    ports:
      - "8094:8094"
    depends_on:
      - mariadb

  chat-service:
    build: ./chat-service
    container_name: chat-backend
    ports:
      - "8095:8095"
    depends_on:
      - mariadb

  data-mining-service:
    build: ./data-mining-service
    container_name: data-mining-backend
    ports:
      - "8096:8096"
    depends_on:
      - mongodb
      - mariadb

### FRONTEND

  frontend-web:
    build: ./frontend-web
    container_name: grapes-frontend
    ports:
      - "3001:80"
    depends_on:
      - api-gateway

  frontend-auth:
    build: ./auth-service/auth-frontend
    container_name: auth-frontend
    ports:
      - "3002:81"
    depends_on:
      - api-gateway

  frontend-payment:
    build: ./payment-service/payment-frontend
    container_name: payment-frontend
    ports:
      - "3003:82"
    depends_on:
      - api-gateway

volumes:
  mariadb_data:
  mongodb_data:
  sonarqube-data:
