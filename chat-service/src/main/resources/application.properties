
spring.application.name=chat-service
server.port=${CHAT_SERVICE_PORT}
spring.data.mongodb.uri=${CHAT_MONGO_URI}
spring.data.mongodb.database=${CHAT_MONGO_DB}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

pusher.app_id=${PUSHER_APP_ID}
pusher.key=${PUSHER_APP_KEY}
pusher.secret=${PUSHER_SECRET}
pusher.cluster=${PUSHER_CLUSTER}
pusher.encrypted=true
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

#for debug
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.publisher-confirm-type=correlated
logging.level.org.springframework.amqp=DEBUG

## Monitoring
management.endpoints.web.exposure.include=*
management.metrics.tags.service=api-service