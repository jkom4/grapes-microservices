spring.application.name=api-gateway
server.port=${GATEWAY_PORT}

# ======================
# ROUTING CONFIGURATION
# ======================
# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URI}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**
spring.cloud.gateway.routes[0].filters[1]=RemoveRequestHeader=Cookie
# Désactive le rate-limiting pour les routes publiques
spring.cloud.gateway.routes[0].filters[2]=SetRequestHeader=X-RateLimit-Bypass, true



# Sales Service
spring.cloud.gateway.routes[1].id=sales-service
spring.cloud.gateway.routes[1].uri=${SALES_SERVICE_URI}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clm/**,/api/cll/**

# Payment Service
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=${PAYMENT_SERVICE_URI}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payments/**

# Chat Service
spring.cloud.gateway.routes[3].id=chat-service
spring.cloud.gateway.routes[3].uri=${CHAT_SERVICE_URI}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/chat/**

# Data Mining Service
spring.cloud.gateway.routes[4].id=data-mining-service
spring.cloud.gateway.routes[4].uri=${DATA_MINING_SERVICE_URI}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/analytics/**

# ======================
# STRIP PREFIX CONFIG
# ======================
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# ======================
# REDIS CONFIGURATION
# ======================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5000ms

# ======================
# JWT CONFIGURATION
# ======================
jwt.secret=${GRAPES_JWT_SECRET_KEY}
jwt.expiration=${ACCESS_TOKEN_EXPIRATION}


spring.main.web-application-type=reactive


# Active les logs de routage
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.http.server.reactive=TRACE
logging.level.org.springframework.web.server=TRACE