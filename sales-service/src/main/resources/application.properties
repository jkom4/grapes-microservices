spring.application.name=sales-service
server.port=${SALES_SERVICE_PORT}


# MariaDB
spring.datasource.url=${SALES_DB_URL}
spring.datasource.username=${SALES_DB_USER}
spring.datasource.password=${SALES_DB_PASSWORD}


# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=grapes

#THIS CODE NOT FOR PRODUCTION
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.jackson.serialization.indent_output=true
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.validator=TRACE
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG
#TO REMOVE FOR PRODUCTION

