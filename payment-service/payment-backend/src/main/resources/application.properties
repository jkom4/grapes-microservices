# Spring Boot application name
spring.application.name=${APPLICATION_NAME}

# Bank account information
app.grapes.account.number=${BANK_ACCOUNT_NUMBER}
app.grapes.account.name=${BANK_ACCOUNT_NAME}
app.grapes.client.PASSWORD=${BANK_CLIENT_PASSWORD}
app.grapes.client.PHONE=${BANK_CLIENT_PHONE}
app.grapes.front.url=${FRONT_END_URL}
# Web Server Configuration (Embedded Tomcat)
server.ssl.enabled=${SERVER_SSL_ENABLED}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE}
server.port=${SERVER_PORT}

# ========================================
# Database Configuration (MariaDB)
# ========================================
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=${DB_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${DB_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}

# ========================================
# Twilio Configuration (for sending OTP SMS)
# ========================================
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

# ========================================
# Liquibase Configuration (Database Migration Management)
# ========================================
spring.liquibase.enabled=${LIQUIBASE_ENABLED}
spring.liquibase.change-log=${LIQUIBASE_CHANGELOG}
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS}

# ========================================
# Application Security Configuration
# ========================================
password.salt=${PASSWORD_SALT}
app.jwt.secret=${JWT_SECRET}
app.encryption.key=${ENCRYPTION_KEY}

# ========================================
# Port Configuration for Internal Servers (ACS/ACQ)
# ========================================
app.ports.acs=${PORT_ACS}
app.ports.acs.money=${PORT_ACS_MONEY}
app.ports.acq=${PORT_ACQ}

# ========================================
# Keystore Configuration (Contain PRIVATE keys and identity certificates)
# ========================================

# --- ACS Server Keystore ---
app.keystore.path=${KEYSTORE_ACS_PATH}
app.keystore.password=${KEYSTORE_ACS_PASSWORD}
app.keystore.key.alias=${KEYSTORE_ACS_KEY_ALIAS}
app.keystore.key.password=${KEYSTORE_ACS_KEY_PASSWORD}

# --- ACQ Server Keystore ---
app.keystore.acq.path=${KEYSTORE_ACQ_PATH}
app.keystore.acq.password=${KEYSTORE_ACQ_PASSWORD}
app.keystore.acq.key.alias=${KEYSTORE_ACQ_KEY_ALIAS}
app.keystore.acq.key.password=${KEYSTORE_ACQ_KEY_PASSWORD}

# --- Client/Backend Keystore ---
app.keystore.client.path=${KEYSTORE_CLIENT_PATH}
app.keystore.client.password=${KEYSTORE_CLIENT_PASSWORD}
app.keystore.client.alias=${KEYSTORE_CLIENT_ALIAS}
app.keystore.client.key.password=${KEYSTORE_CLIENT_KEY_PASSWORD}

# ========================================
# Truststore Configuration (Contain PUBLIC certificates of TRUSTED entities)
# ========================================

# --- Truststore used by ACS Server ---
app.truststore.acs.path=${TRUSTSTORE_ACS_PATH}
app.truststore.acs.password=${TRUSTSTORE_ACS_PASSWORD}
app.truststore.client.alias=${TRUSTSTORE_ACS_CLIENT_ALIAS}
app.truststore.acq.alias=${TRUSTSTORE_ACS_ACQ_ALIAS}

# --- Truststore used by ACQ Server ---
app.truststore.acq.path=${TRUSTSTORE_ACQ_PATH}
app.truststore.acq.password=${TRUSTSTORE_ACQ_PASSWORD}
app.truststore.acs.alias.in.acq=${TRUSTSTORE_ACQ_ACS_ALIAS}

# --- Truststore used by the Backend ---
app.truststore.client.path=${TRUSTSTORE_CLIENT_PATH}
app.truststore.client.password=${TRUSTSTORE_CLIENT_PASSWORD}
app.truststore.acs.alias=${TRUSTSTORE_CLIENT_ACS_ALIAS}
app.truststore.acq.alias.in.client=${TRUSTSTORE_CLIENT_ACQ_ALIAS}

# ========================================
# Logging Configuration
# ========================================
logging.level.grapes.microservices=${LOG_LEVEL}

# ========================================
# Redis Configuration
# ========================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.cache.type=${CACHE_TYPE}

# ========================================
# RabbitMq Configuration
# ========================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.retry.enabled=${RABBITMQ_RETRY_ENABLED}
spring.rabbitmq.listener.simple.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS}
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL}
spring.rabbitmq.listener.simple.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER}
spring.rabbitmq.listener.simple.retry.max-interval=${RABBITMQ_RETRY_MAX_INTERVAL}

# ========================================
# Oracle Cloud Configuration
# ========================================
app.cloud.oracle.region-id=${ORACLE_REGION_ID}
app.cloud.oracle.tenancy-namespace=${ORACLE_TENANCY_NAMESPACE}