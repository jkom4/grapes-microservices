# Spring Boot application name
spring.application.name=payment-backend

# Web Server Configuration (Embedded Tomcat)
# SSL disabled for the main server (internal communications use SSL sockets)
server.ssl.enabled=false
# server.ssl.key-store=classpath:server_keystore.jks
# server.ssl.key-store-password=komnoupoueamine
# Keystore type for the main server (if SSL were enabled)
server.ssl.key-store-type=JKS
# Port on which the backend server listens for HTTP requests
server.port=8093

# ========================================
# Database Configuration (MariaDB)
# ========================================
spring.datasource.url=jdbc:mariadb://localhost:3306/payment_db
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=SparringMASI!
# Specific Hibernate dialect for MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDB106Dialect
# Database schema update strategy by Hibernate ('update', 'validate', 'create', 'none')
spring.jpa.hibernate.ddl-auto=update
# Log SQL queries executed by Hibernate (useful in dev)
spring.jpa.show-sql=true

# ========================================
# Twilio Configuration (for sending OTP SMS)
# ========================================
# Twilio account identifier
twilio.account.sid=AC4466859a75cfe0db79a2249a3aaed38d
# Twilio authentication token
twilio.auth.token=eb1cf2e740a6d613ebe1bd7cb68fe9b0
# Twilio phone number used to send SMS
twilio.phone.number=+12254603862

# ========================================
# Liquibase Configuration (Database Migration Management)
# ========================================

spring.liquibase.enabled=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.liquibase.contexts=grapes

# ========================================
# Application Security Configuration
# ========================================
# Static salt used for password hashing (Weakness: ideally use per-user salt)
password.salt=HIARD

# ========================================
# Port Configuration for Internal Servers (ACS/ACQ)
# ========================================

# Main ACS server port (initial Client/Backend -> ACS communication)
app.ports.acs=8081
# ACS "Money" server port (token validation ACQ -> ACS)
app.ports.acs.money=8083
# ACQ server port (receives token from Backend, communicates with ACS Money)
app.ports.acq=8082

# ========================================
# Keystore Configuration (Contain PRIVATE keys and identity certificates)
# ========================================

# --- ACS Server Keystore ---

# Used by ACS to prove its identity and sign its messages
app.keystore.path=src/main/resources/keystore/acs_keystore.jks
app.keystore.password=bankservicepassword
# Alias of the ACS private key/certificate in this keystore
app.keystore.key.alias=acs
app.keystore.key.password=bankservicepassword

# --- ACQ Server Keystore ---

# Used by ACQ to prove its identity (if TLS client auth) and sign its messages to ACS
app.keystore.acq.path=src/main/resources/keystore/acq_keystore.jks
app.keystore.acq.password=bankservicepassword
# Alias of the ACQ private key/certificate in this keystore
app.keystore.acq.key.alias=acq
app.keystore.acq.key.password=bankservicepassword

# --- Client/Backend Keystore ---

# Used by the Backend to sign its initial messages to ACS
app.keystore.client.path=src/main/resources/keystore/client_keystore.jks
app.keystore.client.password=bankservicepassword
# Alias of the Client/Backend private key/certificate in this keystore
app.keystore.client.alias=client
app.keystore.client.key.password=bankservicepassword

# ========================================
# Truststore Configuration (Contain PUBLIC certificates of TRUSTED entities)
# ========================================
# Who trusts whom for verifying signatures or TLS connections?

# --- Truststore used by ACS Server ---
app.truststore.acs.path=src/main/resources/keystore/acs_truststore.jks
app.truststore.acs.password=bankservicepassword

# Aliases WITHIN acs_truststore.jks used by AcsServer to verify signatures:
# Alias of the Client/Backend's public certificate (to verify requests on port 8081)
app.truststore.client.alias=client_trusted

# Alias of the ACQ's public certificate (to verify requests on port 8083)
app.truststore.acq.alias=acq_trusted


# --- Truststore used by ACQ Server ---
app.truststore.acq.path=src/main/resources/keystore/acq_truststore.jks
app.truststore.acq.password=bankservicepassword

# Aliases WITHIN acq_truststore.jks used by AcqServer to verify signatures:
# Alias of the ACS's public certificate (to verify ACS responses received on port 8083)
app.truststore.acs.alias.in.acq=acs_trusted


# --- Truststore used by the Backend (PaymentService, CardService, AcsService) ---

app.truststore.client.path=src/main/resources/keystore/client_truststore.jks
app.truststore.client.password=bankservicepassword

# Aliases WITHIN client_truststore.jks used by the Backend to verify signatures/connections:
# Alias of the ACS's public certificate (to verify ACS responses on port 8081 and TLS connection)
app.truststore.acs.alias=acs_trusted
# Alias of the ACQ's public certificate (to verify TLS connection to ACQ server)
app.truststore.acq.alias.in.client=acq_trusted

# ========================================
# Logging Configuration
# ========================================

logging.level.grapes.microservices=DEBUG