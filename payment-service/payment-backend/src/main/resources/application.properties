# Spring Boot application name
spring.application.name=${PAYMENT_SERVICE_HOST}

# Bank account information
app.grapes.account.number=${PAYMENT_BANK_ACCOUNT_NUMBER}
app.grapes.account.name=${PAYMENT_BANK_ACCOUNT_NAME}
app.grapes.client.PASSWORD=${PAYMENT_BANK_CLIENT_PASSWORD}
app.grapes.client.PHONE=${PAYMENT_BANK_CLIENT_PHONE}
app.grapes.front.url=${PAYMENT_FRONT_END_URL}
# Web Server Configuration (Embedded Tomcat)
server.ssl.enabled=${PAYMENT_SERVER_SSL_ENABLED}
server.ssl.key-store-type=${PAYMENT_SERVER_SSL_KEY_STORE_TYPE}
server.port=${PAYMENT_SERVER_PORT}



# ========================================
# Database Configuration (MariaDB)
# ========================================
spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MariaDB106Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========================================
# Twilio Configuration (for sending OTP SMS)
# ========================================
twilio.account.sid=${PAYMENT_TWILIO_ACCOUNT_SID}
twilio.auth.token=${PAYMENT_TWILIO_AUTH_TOKEN}
twilio.phone.number=${PAYMENT_TWILIO_PHONE_NUMBER}

# ========================================
# Liquibase Configuration (Database Migration Management)
# ========================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.contexts=grapes


# ========================================
# Application Security Configuration
# ========================================
password.salt=${PAYMENT_PASSWORD_SALT}

# ========================================
# Port Configuration for Internal Servers (ACS/ACQ)
# ========================================
app.ports.acs=${PAYMENT_PORT_ACS}
app.ports.acs.money=${PAYMENT_PORT_ACS_MONEY}
app.ports.acq=${PAYMENT_PORT_ACQ}

# ========================================
# Keystore Configuration (Contain PRIVATE keys and identity certificates)
# ========================================

# --- ACS Server Keystore ---
app.keystore.path=${PAYMENT_KEYSTORE_ACS_PATH}
app.keystore.password=${PAYMENT_KEYSTORE_ACS_PASSWORD}
app.keystore.key.alias=${PAYMENT_KEYSTORE_ACS_KEY_ALIAS}
app.keystore.key.password=${PAYMENT_KEYSTORE_ACS_KEY_PASSWORD}

# --- ACQ Server Keystore ---
app.keystore.acq.path=${PAYMENT_KEYSTORE_ACQ_PATH}
app.keystore.acq.password=${PAYMENT_KEYSTORE_ACQ_PASSWORD}
app.keystore.acq.key.alias=${PAYMENT_KEYSTORE_ACQ_KEY_ALIAS}
app.keystore.acq.key.password=${PAYMENT_KEYSTORE_ACQ_KEY_PASSWORD}

# --- Client/Backend Keystore ---
app.keystore.client.path=${PAYMENT_KEYSTORE_CLIENT_PATH}
app.keystore.client.password=${PAYMENT_KEYSTORE_CLIENT_PASSWORD}
app.keystore.client.alias=${PAYMENT_KEYSTORE_CLIENT_ALIAS}
app.keystore.client.key.password=${PAYMENT_KEYSTORE_CLIENT_KEY_PASSWORD}

# ========================================
# Truststore Configuration (Contain PUBLIC certificates of TRUSTED entities)
# ========================================

# --- Truststore used by ACS Server ---
app.truststore.acs.path=${PAYMENT_TRUSTSTORE_ACS_PATH}
app.truststore.acs.password=${PAYMENT_TRUSTSTORE_ACS_PASSWORD}
app.truststore.client.alias=${PAYMENT_TRUSTSTORE_ACS_CLIENT_ALIAS}
app.truststore.acq.alias=${PAYMENT_TRUSTSTORE_ACS_ACQ_ALIAS}

# --- Truststore used by ACQ Server ---
app.truststore.acq.path=${PAYMENT_TRUSTSTORE_ACQ_PATH}
app.truststore.acq.password=${PAYMENT_TRUSTSTORE_ACQ_PASSWORD}
app.truststore.acs.alias.in.acq=${PAYMENT_TRUSTSTORE_ACQ_ACS_ALIAS}

# --- Truststore used by the Backend ---
app.truststore.client.path=${PAYMENT_TRUSTSTORE_CLIENT_PATH}
app.truststore.client.password=${PAYMENT_TRUSTSTORE_CLIENT_PASSWORD}
app.truststore.acs.alias=${PAYMENT_TRUSTSTORE_CLIENT_ACS_ALIAS}
app.truststore.acq.alias.in.client=${PAYMENT_TRUSTSTORE_CLIENT_ACQ_ALIAS}



# ========================================
# Redis Configuration
# ========================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# ========================================
# RabbitMq Configuration
# ========================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}


# ========================================
# Oracle Cloud Configuration
# ========================================
app.cloud.oracle.region-id=${PAYMENT_ORACLE_REGION_ID}
app.cloud.oracle.tenancy-namespace=${PAYMENT_ORACLE_TENANCY_NAMESPACE}

## Monitoring
management.endpoints.web.exposure.include=*
management.metrics.tags.service=api-service
