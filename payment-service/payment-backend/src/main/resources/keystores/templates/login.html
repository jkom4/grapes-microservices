<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgb(255, 255, 255);
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            border-radius: 10px;
            text-align: center;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        img {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-weight: bold;
        }
        #errorMessage {
            color: red;
            display: none;
            margin-top: 10px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-container">
        <img src="./images/SMPB.png" alt="Logo Banque">
    </div>
    <h2>Connexion</h2>
    <form id="loginForm">
        <label>Nom d'utilisateur :</label>
        <input type="text" id="login" placeholder="Entrez votre nom d'utilisateur" required>
        <label>Mot de passe :</label>
        <input type="password" id="password" placeholder="Entrez votre mot de passe" required>
        <button type="submit">Se connecter</button>
    </form>
    <p id="errorMessage">Identifiants incorrects.</p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;

        // Envoi de la requête au serveur ACS
        const response = await fetch('https://127.0.0.1:8043/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, password })
        });

        if (response.ok) {
            window.location.href = '/payment';
        } else {
            document.getElementById('errorMessage').style.display = 'block';
        }
    });
</script>
</body>
</html>
