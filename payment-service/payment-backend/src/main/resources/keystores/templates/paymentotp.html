<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Vérification de paiement</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f4f4f4;
			display: flex;
			justify-content: center;
			height: 112vh;
			margin: 0;
			padding: 20px;
			box-sizing: border-box;
		}
		.container {
			background: rgb(255, 255, 255);
			padding: 20px;
			box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
			width: 550px;
			border-radius: 10px;
			text-align: center;
		}
		.logo-container {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}
		.left-logo {
			text-align: left;
		}
		.right-logos {
			display: flex;
			gap: 20px;
			align-content: center;
		}
		img {
			max-width: 120px;
			max-height: 120px;
			object-fit: contain;
		}
		input {
			width: 100%;
			padding: 8px;
			margin-top: 10px;
			border: 1px solid #ccc;
			border-radius: 5px;
			box-sizing: border-box;
		}
		button {
			background-color: blue;
			color: white;
			padding: 12px;
			width: 100%;
			border: none;
			margin-top: 20px;
			cursor: pointer;
			border-radius: 5px;
			font-weight: bold;
			transition: background-color 0.3s;
		}
		button:hover {
			background-color: darkblue;
		}
		label {
			display: block;
			text-align: left;
			margin-top: 10px;
		}
		#errorMessage {
			color: red;
			display: none;
			margin-top: 10px;
		}
	</style>
</head>
<body>
<div class="container">
	<div class="logo-container">
		<div class="left-logo">
			<img src="images/SMPB.png" alt="Logo Banque">
		</div>
		<div class="right-logos">
			<img src="images/verified_by_visa.png" alt="Verified by Visa">
			<img src="images/mastercardsecurecode_logo.png" alt="MasterCard">
		</div>
	</div>
	<p>A verification code has been sent to your registered number.</p>
	<form id="paymentForm">
		<label>Marchant name :</label>
		<input type="text" value="Grapes" disabled>
		<label>Amount of the transaction :</label>
		<input type="text" value="EURO 45.99 €" disabled>
		<label>Card number :</label>
		<input type="text" value="XXXX XXXX XXXX 0237" disabled>
		<label>Entrez le code reçu :</label>
		<input type="text" id="paymentToken" placeholder="Entrer the OTP code here">
		<button type="submit">Confirm</button>
	</form>
	<p id="errorMessage">Paiement échoué, le code n'a pas pu être vérifié.</p>
</div>

<script>
	document.getElementById('paymentForm').addEventListener('submit', async (e) => {
		e.preventDefault();
		const paymentToken = document.getElementById('paymentToken').value;
		if (paymentToken.trim() === "") {
			alert("Veuillez entrer le code reçu.");
		} else {
			// Envoi de la requête au serveur ACS
			const response = await fetch('https://127.0.0.1:8043/payment', {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({paymentToken})
			});
			if (response.ok) {
				// Affiche une pop-up avec le token utilisé
				alert('Paiement réussi avec le code : ' + paymentToken);

				// Affiche un message avec un timer de 3 secondes
				const successMessage = document.createElement('div');
				successMessage.innerHTML = `
          <p style="color: green; font-size: 18px;">
            Paiement réussi avec le code : <strong>${paymentToken}</strong>.<br>
            Redirection vers la page d'accueil dans 3 secondes...
          </p>
        `;
				document.body.appendChild(successMessage);

				setTimeout(() => {
					window.location.href = '/';
				}, 3000);
			} else {
				document.getElementById('errorMessage').style.display = 'block';
			}
		}
	});
</script>
</body>
</html>
